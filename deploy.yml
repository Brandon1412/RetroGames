
name: Publicar RetroGames

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: retrogames.web/package-lock.json

      - name: Instalar dependências
        working-directory: retrogames.web
        run: npm ci

      - name: Compilar frontend
        working-directory: retrogames.web
        run: npm run build

      - name: Preparar publicação
        uses: actions/upload-pages-artifact@v3
        with:
          path: retrogames.web/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
